        - { label: "Teks Tombol Kirim", name: "submit", widget: "string" }
        - { label: "Catatan", name: "note", widget: "string" }
        - { label: "Pesan Sukses", name: "success", widget: "text" }
    - label: "Lokasi Pabrik"
      name: "location"
      widget: "object"
      collapsed: true
      fields:
        - { label: "Eyebrow", name: "eyebrow", widget: "string" }
        - { label: "Judul", name: "heading", widget: "string" }
        - { label: "Paragraf", name: "lede", widget: "text" }
        - { label: "Judul Peta (aksesibilitas)", name: "mapTitle", widget: "string" }

# ---------- Collections ----------
collections:
  - name: "pages_id"
    label: "📄 Halaman Situs — Bahasa Indonesia"
    description: "Edit teks & foto tiap halaman (versi Bahasa Indonesia)."
    files:
      - { label: "Beranda", name: "home", file: "src/_data/pagedata/id/home.json", preview_path: "id/", fields: *home_fields }
      - { label: "Tentang Kami", name: "about", file: "src/_data/pagedata/id/about.json", preview_path: "id/tentang-kami/", fields: *about_fields }
      - { label: "Produk & Layanan", name: "products", file: "src/_data/pagedata/id/products.json", preview_path: "id/produk/", fields: *products_fields }
      - { label: "Manufaktur & Kualitas", name: "manufacturing", file: "src/_data/pagedata/id/manufacturing.json", preview_path: "id/manufaktur/", fields: *manufacturing_fields }
      - { label: "Industri", name: "industries", file: "src/_data/pagedata/id/industries.json", preview_path: "id/industri/", fields: *industries_fields }
      - { label: "Klien", name: "clients", file: "src/_data/pagedata/id/clients.json", preview_path: "id/klien/", fields: *clients_fields }
      - { label: "Hubungi Kami", name: "contact", file: "src/_data/pagedata/id/contact.json", preview_path: "id/kontak/", fields: *contact_fields }

  - name: "pages_en"
    label: "📄 Halaman Situs — English"
    description: "Edit teks & foto tiap halaman (versi English)."
    files:
      - { label: "Home", name: "home", file: "src/_data/pagedata/en/home.json", preview_path: "", fields: *home_fields }
      - { label: "About Us", name: "about", file: "src/_data/pagedata/en/about.json", preview_path: "about/", fields: *about_fields }
      - { label: "Products & Services", name: "products", file: "src/_data/pagedata/en/products.json", preview_path: "products/", fields: *products_fields }
      - { label: "Manufacturing & Quality", name: "manufacturing", file: "src/_data/pagedata/en/manufacturing.json", preview_path: "manufacturing/", fields: *manufacturing_fields }
      - { label: "Industries", name: "industries", file: "src/_data/pagedata/en/industries.json", preview_path: "industries/", fields: *industries_fields }
      - { label: "Clients", name: "clients", file: "src/_data/pagedata/en/clients.json", preview_path: "clients/", fields: *clients_fields }
      - { label: "Contact Us", name: "contact", file: "src/_data/pagedata/en/contact.json", preview_path: "contact/", fields: *contact_fields }

  - name: "custom_pages"
    label: "📰 Berita / Halaman Baru"
    label_singular: "Berita"
    description: "Tulis berita, promo, atau pengumuman. Satu entri = SATU bahasa. Untuk tampil dua bahasa, buat DUA entri (satu Indonesia, satu English) — cara termudah, dan bisa dihubungkan lewat 'Kode Penghubung' agar tombol EN/ID di artikel langsung pindah ke versi bahasa lain. Pratinjau ada di panel kanan sebelum Publish."
    # Pratinjau AKTIF: panel kanan menampilkan artikel PERSIS seperti yang dilihat
    # pengunjung (lihat renderNewsPreview di preview-templates.js).
    folder: "src/custom"
    create: true
    extension: "md"
    # Nama file & alamat URL dibuat OTOMATIS dari bahasa + judul (editor tidak perlu isi slug).
    slug: "{{fields.lang}}-{{title}}"
    summary: "{{title}}  —  [{{lang}}]  ·  {{date | date('DD MMM YYYY')}}"
    sortable_fields: ["date", "title"]
    # Tombol filter di atas daftar berita → saring per bahasa (mis. tampilkan Indonesia saja).
    # Pilihan yang aktif tersimpan, jadi daftar tetap ringkas walau berita banyak.
    view_filters:
      - { label: "🇮🇩 Bahasa Indonesia saja", field: "lang", pattern: "id" }
      - { label: "🇬🇧 English saja", field: "lang", pattern: "en" }
      - { label: "🌐 Campuran 2 bahasa", field: "showBoth", pattern: true }
    # Kelompokkan daftar per bahasa (judul grup "id" / "en").
    view_groups:
      - { label: "Bahasa", field: "lang" }
    fields:
      - { label: "🌐 Bahasa Utama", name: "lang", widget: "select", options: [{ label: "Bahasa Indonesia", value: "id" }, { label: "English", value: "en" }], default: "id", hint: "Bahasa utama berita — menentukan menu tempat ia muncul dan format tanggal. Catatan: isi berita BOLEH ditulis campuran Indonesia + English (blok teks bebas)." }
      - { label: "🌐 Tampilkan di menu Indonesia DAN English (untuk berita campur 2 bahasa)", name: "showBoth", widget: "boolean", default: false, required: false, hint: "Aktifkan bila berita ini memuat campuran Bahasa Indonesia & English dalam satu artikel. Satu berita ini akan muncul di menu Berita versi ID maupun EN — tidak perlu membuat dua entri." }
      - { label: "🔗 Kode Penghubung Versi Bahasa Lain (opsional)", name: "translationKey", widget: "string", required: false, default: "", hint: "Hanya untuk kasus DUA entri terpisah (satu ID, satu EN) yang ingin dihubungkan: isi kode yang SAMA di kedua entri agar tombol EN/ID melompat ke versi bahasa lain. Abaikan jika Anda memakai opsi 'Tampilkan di menu Indonesia DAN English' di atas." }
      - { label: "📝 Judul Berita", name: "title", widget: "string", hint: "Judul utama yang tampil besar di atas artikel dan di daftar berita." }
      - { label: "📅 Tanggal Terbit", name: "date", widget: "datetime", date_format: "DD-MM-YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: false, hint: "Menentukan urutan berita (terbaru tampil paling atas di menu & daftar)." }
      - { label: "🔖 Kategori (Label Kecil)", name: "eyebrow", widget: "string", required: false, default: "Berita", hint: "Contoh: Pengumuman, Promo, Acara. Tampil sebagai label merah kecil di atas judul." }
      - { label: "✍️ Ringkasan Singkat", name: "description", widget: "text", required: false, hint: "1–2 kalimat. Tampil di kartu daftar berita dan saat link dibagikan. Kosong = otomatis dari isi." }
      - { label: "🖼️ Foto Utama (Cover)", name: "heroImage", widget: "image", required: false, hint: "Seret & lepas foto sampul. Tampil besar di atas artikel dan sebagai gambar kartu. Ukuran ideal ±1200px, di bawah 300 KB." }
      - { label: "🖼️ Teks Alt Foto (deskripsi singkat foto)", name: "heroImageAlt", widget: "string", required: false }
      - { label: "🏷️ Tag (opsional)", name: "topics", widget: "list", required: false, default: [], hint: "Kata kunci untuk pengelompokan, mis. produk, karawang, iso. Tekan Enter tiap tag." }
      - label: "🧱 Susunan Isi Berita — tambah Teks & Foto sesuka Anda"
        name: "blocks"
        widget: "list"
        label_singular: "Blok"
        required: false
        collapsed: false
        summary: "{{fields.type}}"
        hint: "Klik tombol biru 'Tambah Susunan Isi Berita' di bawah, lalu pilih jenis blok (Teks, Foto, dll). Susun sebebas Anda — misalnya: Foto → Teks → Foto lagi. Seret ikon titik-titik untuk mengubah urutan."
        types:
          - label: "📝 Teks / Paragraf"
            name: "text"
            widget: "object"
            summary: "📝 Teks"
            fields:
              - { label: "Isi Teks", name: "content", widget: "markdown", buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list", "heading-two", "heading-three", "quote"], editor_components: [], hint: "Ketik paragraf di sini. Pakai tombol di atas kotak untuk tebal, miring, daftar, atau subjudul." }
          - label: "🖼️ Foto (satu foto lebar)"
            name: "image"
            widget: "object"
            summary: "🖼️ Foto: {{fields.caption}}"
            fields:
              - { label: "Foto", name: "image", widget: "image", hint: "Seret & lepas foto ke sini, atau klik untuk memilih. Kompres dulu agar di bawah 300 KB." }
              - { label: "Keterangan Foto (opsional, tampil di bawah foto)", name: "caption", widget: "string", required: false }
              - { label: "Teks Alt (deskripsi singkat untuk Google/aksesibilitas)", name: "alt", widget: "string", required: false }
          - label: "🖼️🖼️ Dua Foto Sejajar"
            name: "twoImages"
            widget: "object"
            summary: "🖼️🖼️ Dua Foto"
            fields:
              - { label: "Foto Kiri", name: "imageLeft", widget: "image" }
              - { label: "Foto Kanan", name: "imageRight", widget: "image" }
              - { label: "Keterangan (opsional, di bawah kedua foto)", name: "caption", widget: "string", required: false }
          - label: "📰 Subjudul"
            name: "heading"
            widget: "object"
            summary: "📰 {{fields.text}}"
            fields:
              - { label: "Teks Subjudul", name: "text", widget: "string" }
          - label: "❝ Kutipan / Sorotan"
            name: "quote"
            widget: "object"
            summary: "❝ {{fields.text}}"
            fields:
              - { label: "Teks Kutipan", name: "text", widget: "text" }
              - { label: "Sumber / Nama (opsional)", name: "cite", widget: "string", required: false }
      - { label: "📄 Isi Lama (Markdown) — biarkan kosong untuk berita baru", name: "body", widget: "markdown", required: false, hint: "Kolom lama. Berita baru cukup pakai 'Susunan Isi Berita' di atas. Jika kolom ini terisi DAN Susunan di atas kosong, maka kolom ini yang dipakai." }

  - name: "settings"
    label: "⚙️ Pengaturan Situs"
    # Pratinjau AKTIF dengan template visual khusus (lihat renderSettings di
    # preview-templates.js) — menampilkan navbar/footer/tab/kartu share, bukan teks mentah.
    files:
      - label: "🏢 Logo, Kontak & Info Perusahaan"
        name: "site"
        file: "src/_data/site.json"
        description: "Ganti logo, favicon, nomor telepon, alamat, email, dan file company profile. Bagian teknis ada di paling bawah (jarang perlu diubah)."
        fields:
          # ————— LOGO & IKON (paling sering diganti — ditaruh paling atas) —————
          - { label: "🖼️ Logo Website (pojok kiri atas)", name: "logo", widget: "image", hint: "Seret & lepas (drag-drop) file logo baru ke kotak ini, atau klik untuk memilih file. Gunakan PNG/SVG dengan latar transparan." }
          - { label: "🖼️ Logo Footer (versi putih, untuk latar gelap)", name: "logoWordmark", widget: "image", hint: "Logo versi putih yang muncul di bagian bawah situs (footer). Seret & lepas file baru untuk mengganti." }
          - { label: "🔖 Favicon (ikon kecil di tab browser)", name: "favicon", widget: "image", hint: "Ikon kotak kecil yang muncul di tab browser. Ukuran ideal 64×64px. Seret & lepas untuk mengganti." }

          # ————— INFO PERUSAHAAN —————
          - { label: "🏢 Nama Perusahaan", name: "companyName", widget: "string" }
          - { label: "📞 Nomor Telepon (yang tampil di situs)", name: "phone", widget: "string", hint: "Contoh: +62 822-8000-5809" }
          - { label: "✉️ Email", name: "email", widget: "string" }
          - { label: "📍 Alamat Lengkap", name: "address", widget: "text" }
          - { label: "🌐 Website (teks yang tampil)", name: "websiteLabel", widget: "string", hint: "Contoh: www.victorindokimiatama.com" }
          - { label: "🌐 Website (alamat lengkap dengan https://)", name: "websiteUrl", widget: "string" }

          # ————— DOKUMEN —————
          - { label: "📄 File Company Profile (PDF)", name: "profilePdf", widget: "file", media_folder: "/src/assets/docs", public_folder: "/assets/docs", hint: "Seret & lepas file PDF company profile terbaru ke sini untuk mengganti yang lama. Semua tombol \"Download Company Profile\" otomatis memakai file baru." }

          # ————— MEDIA SOSIAL —————
          - label: "🔗 Media Sosial (ikon otomatis muncul di footer)"
            name: "social"
            widget: "object"
            collapsed: false
            summary: "Isi yang punya, kosongkan yang tidak dipakai"
            fields:
              - { label: "Instagram (tempel alamat lengkap)", name: "instagram", widget: "string", required: false, default: "", hint: "Contoh: https://instagram.com/namaakun" }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false, default: "" }
              - { label: "Facebook", name: "facebook", widget: "string", required: false, default: "" }
              - { label: "YouTube", name: "youtube", widget: "string", required: false, default: "" }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false, default: "" }

          # ————— FOTO PREVIEW SHARE —————
          - { label: "🖼️ Foto Default Saat Link Dibagikan", name: "defaultShareImage", widget: "image", hint: "Gambar yang muncul ketika alamat situs dibagikan ke WhatsApp/LinkedIn. Seret & lepas untuk mengganti." }

          # ————— PENGATURAN TEKNIS (jarang diubah — di paling bawah, tetap flat agar tidak mematahkan situs) —————
          # Ditandai ⚙️ = teknis. Field tetap flat (bukan object) supaya struktur site.json tidak berubah.
          - { label: "⚙️ Kunci Formulir Kontak (agar pesan masuk email)", name: "contactFormKey", widget: "string", required: false, default: "", hint: "TEKNIS. Agar pesan form kontak masuk ke email: buka web3forms.com → masukkan email info@victorindokimiatama.com → salin Access Key → tempel di sini." }
          - { label: "⚙️ Google Analytics ID (mis. G-XXXXXXX)", name: "googleAnalyticsId", widget: "string", required: false, default: "", hint: "Untuk melacak jumlah pengunjung. Kosongkan untuk mematikan." }
          - { label: "⚙️ ID Widget WhatsApp (Elfsight)", name: "whatsappWidgetId", widget: "string", hint: "ID widget tombol chat WhatsApp dari dashboard Elfsight." }
          - { label: "⚙️ URL Embed Google Maps (peta di halaman Kontak)", name: "mapEmbedUrl", widget: "string" }
          - { label: "⚙️ Nomor Telepon untuk Tombol Klik", name: "phoneHref", widget: "string", hint: "Sama seperti nomor telepon di atas tapi tanpa spasi, format: tel:+6282280005809 — agar bisa langsung ditelepon saat diklik di HP." }
          - { label: "⚙️ Alamat Situs / Base URL", name: "baseUrl", widget: "string", hint: "JANGAN diubah kecuali pindah domain. Contoh: https://victorindokimiatama.com" }
          - label: "🎨 Warna Brand (opsional — hati-hati)"
            name: "brandColors"
            widget: "object"
            collapsed: true
            hint: "PERINGATAN: mengisi ini mengubah warna di SELURUH situs. Kosongkan = warna default. Gunakan kode hex, mis. #9A1208. Salah warna bisa membuat situs sulit dibaca."
            fields:
              - { label: "Merah Utama", name: "crimson", widget: "string", required: false, default: "", pattern: ["^(#([0-9a-fA-F]{6})?)?$", "Kosong atau kode hex 6 digit, mis. #9A1208"] }
              - { label: "Merah Terang (untuk efek hover)", name: "rust", widget: "string", required: false, default: "", pattern: ["^(#([0-9a-fA-F]{6})?)?$", "Kosong atau kode hex, mis. #D63F13"] }
              - { label: "Merah Gelap (banner CTA)", name: "primaryContainer", widget: "string", required: false, default: "", pattern: ["^(#([0-9a-fA-F]{6})?)?$", "Kosong atau kode hex, mis. #4A0404"] }
      - label: "🗺️ Peta Distribusi (halaman Klien)"
        name: "distribution"
        file: "src/_data/distribution.json"
        fields:
          - { label: "URL Embed Google My Maps (opsional — jika diisi, menggantikan peta bawaan)", name: "embedUrl", widget: "string", required: false, default: "", hint: "Buat peta di mymaps.google.com → Share → Embed on my site → salin URL src iframe-nya" }
          - label: "Titik Kota"
            name: "points"
            widget: "list"
            fields:
              - { label: "Nama Kota", name: "name", widget: "string" }
              - { label: "Provinsi/Wilayah", name: "region", widget: "string" }
              - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
              - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }
      - label: "✏️ Teks Menu, Tombol & Tagline"
        name: "ui_labels"
        file: "src/_data/ui.json"
        description: "Ubah nama menu (About/Produk/dll), teks tombol, tagline di bawah logo, dan tulisan di footer. Isi versi English DAN Indonesia."
        fields:
          - label: "English"
            name: "en"
            widget: "object"
            fields: &ui_lang_fields
              - { label: "🏷️ Tagline (teks kecil di bawah logo)", name: "brandTag", widget: "string", hint: "Contoh: Since 1978 · Proven Results" }
              - label: "Menu Navigasi"
                name: "nav"
                widget: "object"
                fields:
                  - { label: "Beranda", name: "home", widget: "string" }
                  - { label: "Tentang", name: "about", widget: "string" }
                  - { label: "Produk", name: "products", widget: "string" }
                  - { label: "Manufaktur (menu atas)", name: "manufacturing", widget: "string" }
                  - { label: "Manufaktur (versi panjang, footer)", name: "manufacturingFull", widget: "string" }
                  - { label: "Industri", name: "industries", widget: "string" }
                  - { label: "Klien", name: "clients", widget: "string" }
                  - { label: "Kontak", name: "contact", widget: "string" }
              - { label: "Tombol: Konsultasi Teknis", name: "ctaConsult", widget: "string" }
              - { label: "Tombol: Unduh Profil Perusahaan", name: "ctaDownload", widget: "string" }
              - label: "Footer"
                name: "footer"
                widget: "object"
                fields:
                  - { label: "Kutipan", name: "quote", widget: "text" }
                  - { label: "Judul: Navigasi", name: "navigation", widget: "string" }
                  - { label: "Judul: Sektor Bisnis", name: "sectors", widget: "string" }
                  - { label: "Judul: Kantor Pusat", name: "office", widget: "string" }
                  - { label: "Link: Cat Otomotif", name: "sectorAutomotive", widget: "string" }
                  - { label: "Link: Marine/Protective", name: "sectorMarine", widget: "string" }
                  - { label: "Link: Cat Arsitektural", name: "sectorArchitectural", widget: "string" }
                  - { label: "Label Telepon", name: "telp", widget: "string" }
                  - { label: "Label Email", name: "email", widget: "string" }
                  - { label: "Teks Hak Cipta", name: "rights", widget: "string" }
                  - { label: "Teks 'Since 1978'", name: "since", widget: "string" }
              - label: "Teks Aksesibilitas (untuk pembaca layar)"
                name: "a11y"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Label Navigasi Utama", name: "primaryNav", widget: "string" }
                  - { label: "Tombol Buka Menu", name: "toggleNav", widget: "string" }
                  - { label: "Alt Logo", name: "logoAlt", widget: "string" }
                  - { label: "Alt Wordmark", name: "wordmarkAlt", widget: "string" }
          - label: "Bahasa Indonesia"
            name: "id"
            widget: "object"
            fields: *ui_lang_fields
